<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubuntu: Cybersecurity Awareness Platform</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-color: #4f46e5; /* Indigo 600 */
            --accent-color: #06b6d4; /* Cyan 500 */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: black; /* Gray 50 */
        }
        /* Custom scrollbar for chat/alerts */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1; /* Gray 300 */
            border-radius: 10px;
        }
        /* Custom CSS for Game elements */
        .game-card {
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
            user-select: none;
        }
        .game-card:hover {
            transform: scale(1.02);
        }
        .bounce-game-area {
            background-color: #0d1a2d; /* Dark blue/Grey for tech look */
            border-radius: 1rem;
            height: 400px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }
        .falling-object {
            position: absolute;
            animation: fall linear 3s infinite;
            padding: 8px 12px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0.9;
            cursor: pointer;
        }
        @keyframes fall {
            0% { top: -50px; }
            100% { top: 100%; }
        }
        /* Biometric Icon Animation */
        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
        }
        .biometric-pulse {
            animation: pulse-green 1.5s infinite;
        }
    </style>
    <script>
        const MAX_LEVEL = 5;
        let currentPage = 'home';
        const views = {
            'home': 'Dashboard',
            'tutorials': 'Interactive Tutorials',
            'threat-map': 'Threat Map & Data',
            'alerts': 'Alerts & Notifications',
            'resources': 'Resources & Reporting',
            'certs': 'Certifications & Pro Training', 
            'admin-logs': 'Admin & Security Logs', // NEW ADMIN PAGE
        };
        
        // Map of Topics to Game Keys and Styles
        const gameViews = {
            'Phishing & Scams': { key: 'phishing', icon: 'scan-eye', color: 'red' },
            'Password Safety': { key: 'password', icon: 'key', color: 'primary' },
            'Safe Browsing': { key: 'browsing', icon: 'link', color: 'accent' },
            'Social Engineering': { key: 'social', icon: 'users', color: 'amber' },
            'Ransomware & Malware': { key: 'ransomware', icon: 'bug', color: 'red' },
            'Mobile Security': { key: 'mobile', icon: 'smartphone', color: 'green' }
        };

        // UPDATED: Simulated Module Progress (Resetting all demo data to a clean start)
        let moduleProgress = {
            'Phishing & Scams': { progress: 0, completed: false, level: 1, quizComplete: false }, 
            'Password Safety': { progress: 0, completed: false, level: 1, quizComplete: false }, 
            'Safe Browsing': { progress: 0, completed: false, level: 1, quizComplete: false },
            'Social Engineering': { progress: 0, completed: false, level: 1, quizComplete: false },
            'Ransomware & Malware': { progress: 0, completed: false, level: 1, quizComplete: false },
            'Mobile Security': { progress: 0, completed: false, level: 1, quizComplete: false }
        };
        
        let activeGameTopic = null; // Stores the full string (e.g., 'Phishing & Scams')
        let isQuizMode = false; // Tracks if the current modal is a quiz or a game
        let gameTimer = null; // Used for timed games like Safe Browsing/Ransomware
        let animationFrameId = null; // Used for continuous loop games
        
        // --- GEMINI API INTEGRATION ---
        
        const GEMINI_API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=";
        const API_KEY = ""; // Placeholder for Canvas runtime

        // Function to call the Gemini API with Search Grounding
        async function callGeminiAPI(prompt, systemInstruction, enableSearch = true) {
            const url = GEMINI_API_URL + API_KEY;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                tools: enableSearch ? [{ "google_search": {} }] : undefined,
                systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined,
            };

            let result = { text: "Error: Could not connect to the AI Agent.", sources: [] };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const jsonResult = await response.json();
                const candidate = jsonResult.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    result.text = candidate.content.parts[0].text;
                    
                    const groundingMetadata = candidate.groundingMetadata;
                    if (groundingMetadata && groundingMetadata.groundingAttributions) {
                        result.sources = groundingMetadata.groundingAttributions
                            .map(attribution => ({
                                uri: attribution.web?.uri,
                                title: attribution.web?.title,
                            }))
                            .filter(source => source.uri && source.title);
                    }
                }
            } catch (e) {
                console.error("Gemini API error:", e);
                // Fallback error message already set in 'result'
            }

            return result;
        }

        // --- NAVIGATION AND STATE ---

        function setView(view) {
            currentPage = view;
            activeGameTopic = null;
            isQuizMode = false;
            renderApp();
            // Clear any active game state when navigating
            if (gameTimer) clearTimeout(gameTimer);
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            // Close mobile menu if open
            const menu = document.getElementById('mobile-menu');
            if (menu.classList.contains('flex')) {
                menu.classList.remove('flex');
                menu.classList.add('hidden');
            }
        }
        
        // --- ADMIN & BIOMETRIC LOGIN LOGIC ---
        function showBiometricModal() {
            const modal = document.getElementById('game-modal');
            const wrapper = document.getElementById('modal-content-wrapper');
            if (modal && wrapper) {
                const contentHtml = `
                    <div class="flex flex-col items-center justify-center p-8 text-center space-y-6">
                        <i data-lucide="fingerprint" class="w-16 h-16 text-primary biometric-pulse rounded-full p-3 bg-indigo-100"></i>
                        <h3 class="text-2xl font-bold text-gray-900">Admin Access: Biometric Verification</h3>
                        <p class="text-gray-600">As a Critical Tier Admin, the system requires biometric verification for access to security logs (SSDLC requirement).</p>
                        <div id="biometric-feedback" class="text-red-500 font-semibold h-6">Scanning...</div>
                        <button onclick="simulateBiometricSuccess()" class="py-3 px-6 bg-green-600 text-white font-bold rounded-xl shadow-md hover:bg-green-700 transition duration-150">
                            Simulate Scan
                        </button>
                        <button onclick="hideModal()" class="py-2 px-4 bg-gray-300 text-gray-800 rounded-xl">
                            Cancel
                        </button>
                    </div>
                `;
                wrapper.innerHTML = contentHtml;
                modal.classList.remove('hidden');
                lucide.createIcons();
            }
        }

        function simulateBiometricSuccess() {
            const feedback = document.getElementById('biometric-feedback');
            if (feedback) {
                feedback.textContent = "Verification Successful! Access Granted.";
                feedback.classList.remove('text-red-500');
                feedback.classList.add('text-green-600');
            }
            setTimeout(() => {
                hideModal();
                setView('admin-logs'); // Navigate to the admin page upon success
            }, 800);
        }

        function getAdminLogView() {
             return `
                <div id="view-admin-logs" class="p-4 lg:p-8 space-y-8">
                    <h2 class="text-3xl font-bold text-red-600 flex items-center">
                        <i data-lucide="server-cog" class="w-7 h-7 mr-3"></i> CRITICAL: Security & Log Database System
                    </h2>
                    <p class="text-gray-600">Centralized log monitoring for high-privilege actions, audit trails, and security alerts (SSDLC Continuous Monitoring Phase).</p>

                    <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
                        <div class="p-4 bg-gray-50 border-b">
                            <h3 class="text-xl font-bold text-gray-900">Recent Critical Events (Last 48 Hours)</h3>
                        </div>
                        <div class="divide-y divide-gray-100 max-h-[600px] overflow-y-auto custom-scroll text-sm">
                            ${renderLogEntry('Admin', 'Failed biometric login attempt (4x) from unknown IP (10.10.1.1).', 'Critical', '2025-11-16 09:15:22')}
                            ${renderLogEntry('Company Partner', 'Unauthorized access attempt on another partner\'s Certification Status API endpoint.', 'High', '2025-11-16 08:55:01')}
                            ${renderLogEntry('Teaching Instructor', 'Bulk download of 500+ student assessment records initiated.', 'Medium', '2025-11-15 22:30:45')}
                            ${renderLogEntry('AI Agent Service', 'Anomaly: High volume of prompts referencing "SQL injection" and "admin passwords" detected.', 'Critical', '2025-11-15 18:05:10')}
                            ${renderLogEntry('Professional Cert', 'Role-Based Access Check failed: Attempted to view Admin Log page.', 'Low', '2025-11-15 12:44:00')}
                            ${renderLogEntry('Admin', 'Successful biometric login from pre-authorized device.', 'Info', '2025-11-15 08:00:00')}
                            ${renderLogEntry('Threat Map Feed', 'External data feed sync complete. 12 new scam types added.', 'Info', '2025-11-14 00:00:00')}
                        </div>
                    </div>
                </div>
            `;
        }
        
        function renderLogEntry(role, message, level, timestamp) {
            let color;
            switch(level) {
                case 'Critical': color = 'bg-red-500 text-white'; break;
                case 'High': color = 'bg-orange-400 text-gray-900'; break;
                case 'Medium': color = 'bg-yellow-400 text-gray-900'; break;
                default: color = 'bg-gray-200 text-gray-700';
            }
            return `
                <div class="flex justify-between items-center p-3 hover:bg-gray-50 transition duration-150">
                    <div class="flex items-center space-x-3 w-1/3">
                        <span class="font-bold w-32 ${color} px-2 py-0.5 rounded-full text-xs text-center">${level}</span>
                        <span class="font-semibold text-gray-900">${role}</span>
                    </div>
                    <div class="w-1/2 text-gray-700">${message}</div>
                    <div class="w-1/6 text-right text-gray-500 text-xs">${timestamp}</div>
                </div>
            `;
        }

        // --- LEVEL ADVANCEMENT LOGIC ---

        function advanceGameLevel(topic, scorePercentage) {
            // Clear any timers or animation frames before advancing
            if (gameTimer) clearTimeout(gameTimer);
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            
            let currentLevel = moduleProgress[topic].level;
            let newLevel = currentLevel;
            let finalProgress = moduleProgress[topic].progress;

            // Quiz mode only grants full completion/failure
            if (isQuizMode) {
                 if (scorePercentage >= 80) {
                    moduleProgress[topic].quizComplete = true;
                    // If quiz passed, force progress to 100%
                    closeGame(topic, 100);
                 } else {
                    // If quiz failed, close but don't gain progress, keep quizComplete false
                    closeGame(topic, moduleProgress[topic].progress); 
                 }
                 return;
            }

            // Game Mode (L1-L4 progression)
            if (scorePercentage >= 80) { 
                newLevel = currentLevel + 1;
                // Calculate progress based on level progression
                finalProgress = Math.min(100, (newLevel - 1) * (100 / MAX_LEVEL)); 
            } else {
                 // Simulate minor progress bump for effort if failed
                finalProgress = Math.min(80, moduleProgress[topic].progress + 10);
            }

            // If game level advances past L4, set progress, but don't mark as full complete (L5 is the quiz)
            if (newLevel > MAX_LEVEL) {
                 moduleProgress[topic].level = MAX_LEVEL; // Cap game progress at MAX_LEVEL
                 closeGame(topic, finalProgress);
            } else {
                // Update progress and level, then re-launch the next level
                moduleProgress[topic].level = newLevel;
                moduleProgress[topic].progress = finalProgress;
                
                // Close current modal and launch the next level
                hideModal(); 
                launchGame(topic); 
            }
        }
        
        // --- MODAL AND GAME LAUNCH/CLOSE ---

        function wrapGameContentInModal(topic, icon, iconColor, currentLevel) {
            const title = isQuizMode ? `${topic} | Final Assessment Quiz` : `${topic} | Level ${currentLevel > MAX_LEVEL ? MAX_LEVEL : currentLevel} of ${MAX_LEVEL - 1} (Game)`;
            
            let contentHtml = '';
            const gameData = gameViews[topic];

            // Delegate content generation
            if (gameData.key === 'phishing') { contentHtml = getPhishingGameContent(topic, currentLevel); }
            else if (gameData.key === 'password') { contentHtml = getPasswordGameContent(topic, currentLevel); }
            else if (gameData.key === 'browsing') { contentHtml = getSafeBrowsingGameContent(topic, currentLevel); }
            else if (gameData.key === 'social') { contentHtml = getSocialEngineeringGameContent(topic, currentLevel); }
            else if (gameData.key === 'ransomware') { contentHtml = getRansomwareGameContent(topic, currentLevel); }
            else if (gameData.key === 'mobile') { contentHtml = getMobileSecurityGameContent(topic, currentLevel); }
            
            return `
                <div class="flex flex-col h-full">
                    <!-- Modal Header -->
                    <div class="flex items-center justify-between p-6 border-b border-gray-200 sticky top-0 bg-white rounded-t-2xl z-10">
                        <h2 class="2xl font-bold text-gray-900 flex items-center text-${iconColor}-600">
                            <i data-lucide="${icon}" class="w-6 h-6 mr-3"></i> ${title}
                        </h2>
                        <button onclick="closeGame()" class="text-gray-500 hover:text-red-600 p-2 rounded-full transition duration-150">
                            <i data-lucide="x" class="w-6 h-6"></i>
                        </button>
                    </div>
                    
                    <!-- Modal Body (Game Content) -->
                    <div class="p-6 overflow-y-auto flex-grow space-y-6 custom-scroll">
                        ${contentHtml}
                        
                        <!-- Exit Button for consistent UX -->
                        <div class="pt-4 border-t border-gray-100">
                            <button onclick="closeGame()" class="w-full py-3 bg-gray-300 text-gray-800 font-bold rounded-xl shadow-md hover:bg-gray-400 transition duration-150 flex items-center justify-center">
                                <i data-lucide="log-out" class="w-5 h-5 mr-2"></i> Exit ${isQuizMode ? 'Quiz' : 'Challenge'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function showModal(contentHtml) {
            const modal = document.getElementById('game-modal');
            const wrapper = document.getElementById('modal-content-wrapper');
            if (modal && wrapper) {
                wrapper.innerHTML = contentHtml; // Inject content
                modal.classList.remove('hidden');
                lucide.createIcons(); // Re-render icons after injection
            }
        }

        function hideModal() {
            // Clear any active game state before hiding the modal
            if (gameTimer) clearTimeout(gameTimer);
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            const modal = document.getElementById('game-modal');
            if (modal) {
                modal.classList.add('hidden');
                document.getElementById('modal-content-wrapper').innerHTML = '';
            }
        }

        function launchGame(topic, mode = 'game') {
            activeGameTopic = topic;
            isQuizMode = (mode === 'quiz');
            const gameData = gameViews[topic];
            let currentLevel = moduleProgress[topic].level;
            
            // If quiz mode is launched, always use the quiz level (L5)
            if (isQuizMode) {
                currentLevel = MAX_LEVEL;
                // If quiz is already complete, show completion screen
                if (moduleProgress[topic].quizComplete) {
                     currentLevel = MAX_LEVEL + 1; 
                }
            } else {
                 // If game is completed, start from L1
                if (currentLevel > MAX_LEVEL) {
                    currentLevel = 1;
                    moduleProgress[topic].level = 1;
                    moduleProgress[topic].progress = 0;
                }
            }
            
            const modalContent = wrapGameContentInModal(
                topic,
                gameData.icon,
                gameData.color,
                currentLevel
            );

            showModal(modalContent);
            
            // Run specific setup functions after content is in the DOM
            if (gameData.key === 'phishing' && currentLevel <= MAX_LEVEL) { setupPhishingGame(currentLevel); }
            else if (gameData.key === 'password' && currentLevel <= MAX_LEVEL) { setTimeout(checkPasswordStrength, 50); }
            else if (gameData.key === 'browsing' && currentLevel <= MAX_LEVEL) { setupBounceGame(currentLevel); }
            else if (gameData.key === 'social' && currentLevel <= MAX_LEVEL) { setupSocialGame(currentLevel); }
            else if (gameData.key === 'ransomware' && currentLevel <= MAX_LEVEL) { setupRansomwareGame(currentLevel); }
            else if (gameData.key === 'mobile' && currentLevel <= MAX_LEVEL) { setupMobileGame(currentLevel); }
        }

        function closeGame(topicToUpdate = null, newProgress = null) {
            // Clear any timers or animation frames before closing
            if (gameTimer) clearTimeout(gameTimer);
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            if (topicToUpdate && newProgress !== null) {
                 moduleProgress[topicToUpdate] = { 
                    ...moduleProgress[topicToUpdate], 
                    progress: newProgress, 
                    completed: moduleProgress[topicToUpdate].quizComplete, // Only marked complete if quiz is passed
                    level: moduleProgress[topicToUpdate].level 
                };
            }
            hideModal();
            activeGameTopic = null;
            isQuizMode = false;
            setView('tutorials'); // Return to the main tutorials list, which re-renders progress
        }

        function renderApp() {
            // Get the main content area container
            const mainContentArea = document.getElementById('main-content-area');
            if (!mainContentArea) return;

            // Update mobile header title
            document.getElementById('header-title').textContent = views[currentPage];

            // 1. Clear current content
            mainContentArea.innerHTML = '';
            
            // 2. Generate and append content for the currentPage
            let contentHtml = '';
            switch (currentPage) {
                case 'home': contentHtml = getHomeView(); break;
                case 'tutorials': contentHtml = getTutorialsView(); break;
                case 'threat-map': contentHtml = getThreatMapView(); break;
                case 'alerts': contentHtml = getAlertsView(); break;
                case 'resources': contentHtml = getResourcesView(); break;
                case 'certs': contentHtml = getCertsView(); break;
                case 'admin-logs': contentHtml = getAdminLogView(); break; // NEW ADMIN LOGS
                default: contentHtml = getHomeView();
            }
            mainContentArea.innerHTML = contentHtml;
            
            // 3. Highlight current navigation links
            Object.keys(views).forEach(view => {
                document.getElementById(`nav-${view}-desktop`)?.classList.remove('bg-indigo-100', 'text-primary');
                document.getElementById(`nav-${view}-mobile`)?.classList.remove('text-primary');
            });
            document.getElementById(`nav-${currentPage}-desktop`)?.classList.add('bg-indigo-100', 'text-primary');
            document.getElementById(`nav-${currentPage}-mobile`)?.classList.add('text-primary');

            // 4. Re-render icons after DOM manipulation
            lucide.createIcons();
        }

        // --- Utility Functions ---
        
        function dataVisPlaceholder(title, description, color, icon) {
            return `
                <div class="p-4 bg-white rounded-xl shadow-lg border border-gray-100">
                    <div class="flex items-center justify-between">
                        <div class="text-3xl font-semibold text-gray-900">${title}</div>
                        <div class="p-2 rounded-full bg-${color}-100 text-${color}-600">
                            <i data-lucide="${icon}" class="w-6 h-6"></i>
                        </div>
                    </div>
                    <p class="mt-1 text-sm text-gray-500">${description}</p>
                </div>
            `;
        }

        function renderAlert(title, message, date, type) {
            let color, icon;
            switch(type) {
                case 'critical': color = 'red'; icon = 'alert-triangle'; break;
                case 'advisory': color = 'yellow'; icon = 'zap'; break;
                case 'tip': color = 'green'; icon = 'lightbulb'; break;
                default: color = 'blue'; icon = 'info';
            }
            return `
                <div class="flex items-start space-x-4 p-4 border-b border-gray-100 hover:bg-gray-50 transition duration-150 rounded-xl">
                    <div class="p-2 rounded-full bg-${color}-100 text-${color}-600 flex-shrink-0 mt-1">
                        <i data-lucide="${icon}" class="w-5 h-5"></i>
                    </div>
                    <div class="flex-grow">
                        <h4 class="font-semibold text-gray-900">${title}</h4>
                        <p class="text-sm text-gray-600 mt-1">${message}</p>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-xs font-medium text-gray-400">${date}</span>
                            <span class="text-xs font-semibold uppercase text-${color}-600 bg-${color}-100 px-2 py-0.5 rounded-full">${type}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // NEW: Certification card using the same structure as tutorials
        function renderCertProfCard(title, description, cost, icon, costColor='text-green-600') {
            return `
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 p-6 space-y-4 transform transition duration-300 hover:shadow-2xl hover:-translate-y-1">
                    <div class="flex items-center space-x-4">
                        <div class="p-3 rounded-xl bg-accent/10 text-accent">
                            <i data-lucide="${icon}" class="w-6 h-6"></i>
                        </div>
                        <h3 class="text-xl font-bold text-gray-900">${title}</h3>
                    </div>
                    <p class="text-gray-600 text-sm">${description}</p>
                    <div class="flex justify-between items-center pt-2 border-t border-gray-100">
                        <span class="text-lg font-bold ${costColor}">${cost}</span>
                        <button class="py-2 px-4 text-sm font-semibold rounded-lg bg-primary text-white hover:bg-indigo-700 transition duration-150">
                            Enroll Now
                        </button>
                    </div>
                </div>
            `;
        }


        function renderTutorialCard(topic, progress, icon) {
            const currentProgress = moduleProgress[topic]?.progress || 0;
            const completed = moduleProgress[topic]?.completed || false;
            const level = moduleProgress[topic]?.level || 1;
            const quizComplete = moduleProgress[topic]?.quizComplete || false;
            
            const progressColor = completed ? 'bg-green-500' : (level > MAX_LEVEL ? 'bg-yellow-500' : 'bg-primary');
            let statusText = completed ? 'Completed & Certified' : `Progress: ${currentProgress}% (Game Level ${level > MAX_LEVEL ? MAX_LEVEL : level})`;
            if (level > MAX_LEVEL && !completed) {
                statusText = `Game Completed! Ready for Quiz.`;
            }
            
            const gameButtonText = (level > MAX_LEVEL) ? 'Review Game' : 'Start Game';

            return `
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden transform transition duration-300 hover:shadow-2xl hover:-translate-y-1 border border-gray-100">
                    <div class="p-6">
                        <div class="flex items-center space-x-4">
                            <div class="p-3 rounded-xl bg-primary/10 text-primary">
                                <i data-lucide="${icon}" class="w-6 h-6"></i>
                            </div>
                            <h3 class="text-xl font-bold text-gray-900">${topic}</h3>
                        </div>
                        <p class="mt-4 text-gray-600 text-sm">Step-by-step visual learning guides and short animated content for ${topic}.</p>
                        
                        <!-- Progress Tracking -->
                        <div class="mt-5">
                            <div class="flex justify-between items-center text-xs font-medium">
                                <span class="text-gray-700">${statusText}</span>
                                ${completed ? '<span class="text-green-600"><i data-lucide="check-circle" class="w-4 h-4 inline-block"></i></span>' : (quizComplete ? '' : '')}
                            </div>
                            <div class="mt-1 w-full bg-gray-200 rounded-full h-2.5">
                                <div class="h-2.5 rounded-full transition-all duration-500 ${progressColor}" style="width: ${currentProgress}%"></div>
                            </div>
                        </div>

                        <div class="mt-5 grid grid-cols-2 gap-3">
                            <button onclick="launchGame('${topic}', 'game')" class="py-2.5 text-sm font-semibold rounded-lg text-white ${level > MAX_LEVEL ? 'bg-indigo-400 hover:bg-indigo-500' : 'bg-primary hover:bg-indigo-700'} transition duration-150">
                                <i data-lucide="play" class="w-4 h-4 mr-1 inline-block"></i> ${gameButtonText}
                            </button>
                            <button onclick="launchGame('${topic}', 'quiz')" class="py-2.5 text-sm font-semibold rounded-lg transition duration-150 ${quizComplete ? 'bg-green-600 text-white hover:bg-green-700' : 'bg-accent/80 text-gray-900 hover:bg-accent'} ${level <= MAX_LEVEL ? 'opacity-50 cursor-not-allowed' : ''}" ${level <= MAX_LEVEL ? 'disabled' : ''}>
                                <i data-lucide="help-circle" class="w-4 h-4 mr-1 inline-block"></i> ${quizComplete ? 'Review Quiz' : 'Start Quiz'}
                            </button>
                        </div>
                        <p class="text-xs text-center text-gray-500 mt-2">Quiz unlocked after Game Level ${MAX_LEVEL} is completed.</p>
                    </div>
                </div>
            `;

        function checkPasswordStrength() {
            const topic = 'Password Safety';
            const level = moduleProgress[topic]?.level || 1;
            const levelData = passwordLevels[level];
            const input = document.getElementById('password-input')?.value || '';
            const scoreMeter = document.getElementById('strength-meter');
            const scoreText = document.getElementById('password-score');
            const strengthText = document.getElementById('strength-text');
            const feedbackList = document.getElementById('feedback-list');
            const submitButton = document.getElementById('password-submit-btn');

            if (!scoreMeter || !scoreText || !strengthText || !feedbackList || !submitButton) return;

            let strength = 0;
            let feedback = [];
            let requiredChecksMet = 0;
            let totalRequiredChecks = 1;

            // --- 1. Length Check ---
            const lenReq = levelData.minLength;
            if (input.length >= lenReq) { strength += 25; requiredChecksMet++; feedback.push({ check: true, text: `Minimum ${lenReq} characters achieved.` }); } 
            else { feedback.push({ check: false, text: `Minimum ${lenReq} characters needed (currently ${input.length}).` }); }

            // --- 2. Mixed Case Check (Required for L2+) ---
            const hasMixedCase = (/[a-z]/.test(input) && /[A-Z]/.test(input));
            if (level >= 2) {
                totalRequiredChecks++;
                if (hasMixedCase) { strength += 25; requiredChecksMet++; feedback.push({ check: true, text: 'Used a mix of upper and lower case letters.' }); } 
                else { feedback.push({ check: false, text: 'Use a mix of upper and lower case letters.' }); }
            }

            // --- 3. Numbers Check (Required for L2+) ---
            const hasNumbers = /\d/.test(input);
            if (level >= 2) {
                totalRequiredChecks++;
                if (hasNumbers) { strength += 25; requiredChecksMet++; feedback.push({ check: true, text: 'Added numbers (0-9).' }); } 
                else { feedback.push({ check: false, text: 'Add numbers (0-9).' }); }
            }

            // --- 4. Symbols Check (Required for L3+) ---
            const hasSymbols = /[^a-zA-Z0-9\s]/.test(input);
            if (level >= 3) {
                totalRequiredChecks++;
                if (hasSymbols) { strength += 25; requiredChecksMet++; feedback.push({ check: true, text: 'Included unique symbols (@, #, $, !).' }); } 
                else { feedback.push({ check: false, text: 'Include unique symbols (@, #, $, !).' }); }
            }
            
            // --- Determine Final Strength and Status ---
            strength = Math.min(100, strength); 
            let colorClass = '';
            let statusText = '';
            const isReadyToAdvance = (requiredChecksMet === totalRequiredChecks) && input.length > 0;
            
            if (input.length === 0) { 
                strength = 0; colorClass = 'bg-gray-400'; statusText = 'Strength: Empty';

                colorClass = 'bg-red-500'; statusText = 'Strength: Weak'; 
            } else if (strength < 75) { 
                colorClass = 'bg-orange-400'; statusText = 'Strength: Moderate'; 
            } else if (strength < 100) { 
                colorClass = 'bg-accent'; statusText = 'Strength: Good'; 
            } else { 
                colorClass = 'bg-green-500'; statusText = 'Strength: Excellent'; 
            }

            // Update visuals
            scoreMeter.style.width = `${strength}%`;
            scoreText.textContent = `${strength}%`;
            scoreMeter.className = `h-3 rounded-full transition-all duration-500 ${colorClass}`;
            strengthText.textContent = statusText;
            
            feedbackList.innerHTML = feedback.map(item => `

            `).join('');

            submitButton.classList.toggle('hidden', !isReadyToAdvance);
            lucide.createIcons();
        }

        function setupBounceGame(level) {

            bounceGameState.misses = 0;

                if (bounceGameState.misses >= 3 || bounceGameState.hits >= bounceGameState.requiredScore) return;

        async function generateReportSummary() {
            const incidentType = document.getElementById('report-incident-type').value;
            const incidentDetails = document.getElementById('report-details').value.trim();
            const reportSummaryBox = document.getElementById('generated-report-summary');
            const generateButton = document.getElementById('generate-report-button');

            if (incidentDetails.length < 50) {
                reportSummaryBox.innerHTML = '<p class="text-red-500 font-semibold">Please provide more detailed information (min 50 characters) before generating the report summary.</p>';
                return;
            }

            const originalButtonHtml = generateButton.innerHTML;
            generateButton.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 mr-2 animate-spin"></i> Generating Summary...`;
            generateButton.disabled = true;

            const userPrompt = `I need a concise, professional, single-paragraph summary for a cybersecurity incident report. The incident type is: "${incidentType}". Details are: "${incidentDetails}". Focus on the technical facts and impact, ensuring a formal tone suitable for management review.`;

            const systemInstruction = "You are a specialized Cybersecurity Incident Report Analyst. Your only task is to transform raw incident details into a professional, factual, single-paragraph summary for formal reporting. Do not add conversational text or formatting (like titles, bullet points, or new lines) to the summary.";
            
            // Use Gemini without search for structured output
            const result = await callGeminiAPI(userPrompt, systemInstruction, false); 

            reportSummaryBox.innerHTML = `
                <h4 class="font-bold text-lg text-primary mb-2 flex items-center"><i data-lucide="file-text" class="w-5 h-5 mr-2"></i> ✨ Professional Summary Draft:</h4>
                <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg whitespace-pre-wrap">${result.text}</div>
                <p class="text-xs text-gray-500 mt-2">Use this summary for the official incident report document.</p>
            `;

            generateButton.innerHTML = originalButtonHtml;
            generateButton.disabled = false;
            lucide.createIcons();
        }

        // --- CHATBOT LLM LOGIC ---

        function appendMessage(sender, text, sources = []) {
            const chatBody = document.getElementById('chat-messages');
            if (!chatBody) return;

            const messageDiv = document.createElement('div');
            messageDiv.className = `flex justify-${sender === 'user' ? 'end' : 'start'}`;
            
            let messageHtml = `<div class="p-3 rounded-xl max-w-[80%] shadow-sm ${sender === 'user' ? 'bg-accent text-white rounded-br-none' : 'bg-gray-100 text-gray-800 rounded-tl-none'}" style="word-break: break-word;">
                ${text}
            `;

            if (sources.length > 0) {
                const sourceHtml = sources.map((s, i) => 
                    `<span class="text-xs text-gray-500 block mt-1"><i data-lucide="link" class="w-3 h-3 inline-block mr-1"></i> Source ${i + 1}: <a href="${s.uri}" target="_blank" class="underline hover:text-primary transition">${s.title.substring(0, 50)}...</a></span>`
                ).join('');
                messageHtml += `<div class="mt-2 pt-2 border-t border-gray-300">${sourceHtml}</div>`;
            }

            messageHtml += `</div>`;
            messageDiv.innerHTML = messageHtml;
            chatBody.appendChild(messageDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
            lucide.createIcons();
        }

        async function handleChatSend() {
            const input = document.getElementById('chat-input');
            const userQuery = input.value.trim();
            const sendButton = document.getElementById('chat-send-button');

            if (userQuery === "") return;

            appendMessage('user', userQuery);
            input.value = '';
            input.disabled = true;
            sendButton.disabled = true;

            // Show loading indicator
            appendMessage('agent', '<span id="loading-dots"><i data-lucide="loader-2" class="w-4 h-4 animate-spin inline-block mr-1"></i> Thinking...</span>');

            const systemInstruction = "You are the Cyber-Safe ZA AI Safety Agent, a friendly and expert guide on cybersecurity in South Africa. Provide clear, concise, and contextually relevant advice. Use the Google Search tool to ensure your information on current threats is up-to-date.";

            const result = await callGeminiAPI(userQuery, systemInstruction, true);

            // Remove loading message and replace with final response
            const chatBody = document.getElementById('chat-messages');
            if (chatBody && chatBody.lastChild) {
                chatBody.removeChild(chatBody.lastChild);
            }
            
            appendMessage('agent', result.text, result.sources);

            input.disabled = false;
            sendButton.disabled = false;
            input.focus();
        }

        function toggleAIChat(show) {
            const chatWindow = document.getElementById('ai-chat-window');
            if (show === true) {
                chatWindow.classList.remove('hidden');
                document.getElementById('ai-agent-button').classList.add('hidden');
                document.getElementById('chat-input').focus();
            } else if (show === false) {
                chatWindow.classList.add('hidden');
                document.getElementById('ai-agent-button').classList.remove('hidden');
            } else {
                chatWindow.classList.toggle('hidden');
                document.getElementById('ai-agent-button').classList.toggle('hidden');
                if (!chatWindow.classList.contains('hidden')) {
                     document.getElementById('chat-input').focus();
                }
            }
            lucide.createIcons();
        }

        function getNavLink(viewKey, label, icon, isMobile = false) {
            const id = `nav-${viewKey}-${isMobile ? 'mobile' : 'desktop'}`;
            const classes = isMobile 
                ? 'flex-1 inline-flex flex-col items-center justify-center p-2 text-xs font-medium text-gray-500 hover:text-primary transition duration-150' 
                : 'flex items-center p-3 rounded-xl hover:bg-indigo-50 text-gray-700 hover:text-primary transition duration-150 cursor-pointer';

            return `<a id="${id}" onclick="setView('${viewKey}')" class="${classes}">
                <i data-lucide="${icon}" class="${isMobile ? 'w-5 h-5 mb-0.5' : 'w-5 h-5 mr-3'}"></i>
                <span class="${isMobile ? 'mt-1' : 'font-medium'}">${label}</span>
            </a>`;
        }

        // --- Main App Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            const appContainer = document.getElementById('app-container');
            
            // Build the main app HTML structure
            appContainer.innerHTML = `
                ${getMobileHeader()}
                <div class="flex flex-grow overflow-hidden">

                    ${getSidebar()}
                    
                    <!-- Main Content Area -->
                    <main id="main-content-area" class="flex-grow overflow-y-auto pb-20 lg:pb-0">
                        <!-- Content will be injected here by renderApp() -->
                    </main>
                </div>
                ${getMobileFooterNav()}

                <!-- AI Cyber-Safety Agent Button (Floating) -->
                <button id="ai-agent-button" onclick="toggleAIChat(true)" 
                    class="fixed bottom-20 right-5 lg:bottom-8 lg:right-8 p-4 bg-primary text-white rounded-full shadow-2xl hover:bg-indigo-700 transition duration-300 z-30 transform hover:scale-110">
                    <i data-lucide="bot" class="w-7 h-7"></i>
                </button>

                <!-- AI Cyber-Safety Agent Chat Window -->
                <div id="ai-chat-window" class="hidden fixed bottom-5 right-5 lg:bottom-8 lg:right-8 w-11/12 max-w-sm h-96 bg-white rounded-2xl shadow-2xl border border-gray-200 z-40 flex flex-col overflow-hidden">
                    <!-- Chat Header -->
                    <div class="flex items-center justify-between p-4 bg-primary text-white rounded-t-xl">
                        <div class="flex items-center">
                            <i data-lucide="bot" class="w-5 h-5 mr-2"></i>

                        </div>
                        <button onclick="toggleAIChat(false)" class="text-white hover:text-indigo-200 p-1 rounded-full">

                        </button>
                    </div>
                    
                    <!-- Chat Messages -->
                    <div id="chat-messages" class="flex-grow p-4 space-y-4 overflow-y-auto custom-scroll">
                        <!-- Initial Message -->
                        <div class="flex justify-start">
                            <div class="bg-gray-100 p-3 rounded-xl rounded-tl-none max-w-[80%] text-gray-800 shadow-sm">
                                Hello! I'm your **AI Cyber-Safety Agent**. Ask me anything about digital security in South Africa, or ask about current scams!
                            </div>
                        </div>
                    </div>

                    <!-- Chat Input -->
                    <div class="p-4 border-t border-gray-200 flex items-center space-x-2">
                        <button class="p-2 text-primary hover:text-indigo-700 rounded-full bg-indigo-50 transition duration-150">
                            <i data-lucide="mic" class="w-5 h-5"></i>
                        </button>
                        <input id="chat-input" type="text" placeholder="Type your security question..." class="flex-grow p-3 border border-gray-300 rounded-xl focus:ring-primary focus:border-primary text-sm">
                        <button id="chat-send-button" onclick="handleChatSend()" class="p-2 text-white bg-primary rounded-xl hover:bg-indigo-700 transition duration-150">
                            <i data-lucide="send" class="w-5 h-5"></i>
                        </button>
                    </div>

            `;
            
            // Initial render, slight delay added to ensure DOM registration is complete
            // This is the key fix for ensuring elements are targetable on load.
            setTimeout(renderApp, 50); 
            
            // Event listener for chat input (Enter key)
            document.getElementById('app-container').addEventListener('keydown', (e) => {
                if (e.target.id === 'chat-input' && e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    document.getElementById('chat-send-button').click();

        });
    </script>
